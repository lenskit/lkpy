[tools]
rust = "stable"
usage = "latest"
uv = "latest"
jq = "latest"
shfmt = "latest"
tombi = "latest"
perl = { version = "latest", os = ["linux", "macos"] }
hk = "latest"
pkl = "latest"
taplo = "latest"
yamlfmt = "latest"
ruff = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
github.github_attestations = false
aqua.github_attestations = false

[settings.python]
# uv_venv_auto = "source"

[deps.uv]

[env]
HK_MISE = 1

[hooks]
postinstall = '''
if [ -z "$CI" ]; then
  hk install
fi
'''
