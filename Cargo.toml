# :tombi toml-version = "v1.0.0
[package]
name = "lenskit"
version = "2026.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "lenskit_accel"
path = "src/accel/lib.rs"

[dependencies]
log = { version = "^0.4", features = ["release_max_level_debug", "serde"] }
pyo3 = { version = "^0.29", features = ["abi3-py312", "extension-module"] }
thiserror = "^2"

arc-swap = "^1.9"
crossbeam-channel = "^0.5"
rayon = "^1.10"
rayon-cancel = "^1.0"

hashbrown = "^0.17"
hex = "^0.4"
ordered-float = "^5"
rand = "^0.10"
rand_pcg = "^0.10"
rustc-hash = "^2.1.1"
sha1 = "^0.11"

peg = "^0.8"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"

arrow = { version = "^59", default-features = false, features = ["pyarrow"] }
arrow-schema = { version = "^59", features = ["serde"] }
ndarray = { version = "^0.17", features = ["rayon"] }
numpy = "^0.29"

[dev-dependencies]
ntest = "^0.9"

[profile.dev]
opt-level = 2
debug-assertions = true
lto = "thin"

[profile.release]
debug = "line-tables-only"
lto = true
