repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
      - id: check-added-large-files
        exclude: pixi\.lock$
      - id: check-json
        exclude: \.(vscode|devcontainer)/.*\.json$
      - id: check-merge-conflict
        exclude: (data/.*/README\.md|\.rst)$
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.7
    hooks:
      # Run the formatter.
      - id: ruff-format
        # Run the linter.
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.5
    hooks:
      - id: tombi-lint
      - id: tombi-format
        exclude: \.lock$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: local
    hooks:
      - id: rustfmt
        name: format rust
        entry: rustfmt --edition 2024
        language: system
        types_or:
          - rust

      - id: license-headers
        name: add license headers
        language: system
        entry: uv run scripts/update-headers.py --error-on-change
        types_or:
          - python
          - rust
