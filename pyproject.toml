[project]
name = "lenskit"
description = "Toolkit for recommender systems research, teaching, and more."
readme = "README.md"
requires-python = ">= 3.12.5"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Michael Ekstrand", email = "mdekstrand@drexel.edu" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click ~=8.1",
  "humanize ~=4.2",
  "lazy-loader >=0.4",
  "numpy >=2.0",
  "packaging >=23.0",
  "pandas >=2.2,<4",
  "prettytable ~=3.14",
  "psutil >=6",
  "py-cpuinfo >=9.0",
  "pyarrow >=20,!=21.*",
  "pydantic-settings~=2.8",
  "pydantic ~=2.12",
  "pyzmq >=26",
  "requests ~=2.28",
  "rich >=13.5",
  "scipy >=1.13",
  # torch inductor needs setuptools
  "setuptools >=80",
  "structlog >=23.2",
  "threadpoolctl >=3.0",
  "torch ~=2.4",
  "typing-extensions ~=4.15",
  "xopen ~=2.0",
]
dynamic = ["version"]

[project.urls]
documentation = "https://lkpy.lenskit.org"
homepage = "https://lenskit.org"
source = "https://github.com/lenskit/lkpy"

[project.scripts]
lenskit = "lenskit.cli:main"

[project.entry-points."lenskit.cli.plugins"]
lenskit-config = "lenskit.cli.config:config"
lenskit-data = "lenskit.cli.data:data"
lenskit-doctor = "lenskit.cli.doctor:doctor"
lenskit-pipeline = "lenskit.cli.pipeline:pipeline"
lenskit-task = "lenskit.cli.task:task"
lenskit-train = "lenskit.cli.train:train"
lenskit-tune = "lenskit.cli.tune:tune"
lenskit-recommend = "lenskit.cli.recommend:recommend"
lenskit-profile = "lenskit.cli.profile:profile"

[project.optional-dependencies]
cli-extra = ["termaid ~= 0.6.1"]
funksvd = []
gnn = ["torch_geometric ~=2.6"]
hpf = ["hpfrec~=0.2.12"]
implicit = ["implicit >=0.7.2"]
notebook = ["ipywidgets ~=8.0"]
ray = ["ray ~=2.42"]
sklearn = ["scikit-learn ~=1.5"]
tune = ["optuna ~=4.8"]

[dependency-groups]
dev = [
  "cibuildwheel ~=2.23",
  "esbonio>=2.0.0",
  "ipython >=7",
  "line_profiler",
  "nox>=2025.5.1",
  # stub files
  "pandas-stubs >=2.2,<4",
  "py-spy>=0.4.1",
  "pyarrow-stubs >=11",
  "ruff >=0.16",
  "scipy-stubs >=1.14.1.6",
  "sphinx-autobuild >=2021",
  "ty >=0.0.55",
  "unbeheader ~=1.3",
  "zstandard>=0.23.0",
  { include-group = "demo" },
  { include-group = "doc" },
  { include-group = "package" },
  { include-group = "reporting" },
  { include-group = "scripting" },
  { include-group = "test" },
]
cpu = ["torch ~=2.4"]
demo = [
  "matplotlib ~=3.4",
  "nbformat >=5.2",
  "nbval >=0.9",
  "notebook >=6",
  "pyprojroot >=0.3",
  "seaborn >=0.13.2,<0.14",
]
doc = [
  "myst-nb >=0.13",
  "packaging >=25.0",
  "pydata-sphinx-theme ~=0.16.0",
  "sphinx-autoapi ~=3.8",
  "sphinx-copybutton>=0.5.2",
  "sphinx-new-tab-link>=0.8.0",
  "sphinx-togglebutton >=0.4",
  "sphinx >=9.0",
  "sphinxcontrib-bibtex >=2.0",
  "sphinxcontrib-mermaid ~=2.0",
  "sphinxext-opengraph >=0.5",
  { include-group = "package" },
]
gpu = ["torch ~=2.4"]
package = ["lazy-loader >=0.4", "maturin ~=1.10", "packaging >=25.0"]
reporting = ["coverage >=5"]
scripting = [
  "docopt-ng >=0.9.0",
  "tomlkit ~=0.14.0",
  { include-group = "package" },
]
test = [
  "hypothesis ~=6.139",
  "pytest-benchmark ~=5.1",
  "pytest-cov >=2.12",
  "pytest-doctestplus >=1.2.1,<2",
  "pytest-retry ~=1.7",
  "pytest >=8.2,<10",
  "pyyaml >=5.0",
]

# :tombi toml-version = "v1.0.0
[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

# dev tool configuration
[tool.coverage.run]
relative_files = "true"
include = ["src/lenskit/*"]
omit = ["src/lenskit/_version.py"]

# configure build tools
[tool.maturin]
editable-profile = "dev"
module-name = "lenskit._accel"
profile = "release"
python-source = "src"

[tool.pyright]
typeCheckingMode = "basic"
exclude = [
  "docs/*",
  ".pixi",
  ".venv",
  ".nox",
  "target",
  "build",
  "dist",
  "output",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--benchmark-skip"
consider_namespace_packages = true
filterwarnings = [
  "ignore:::pyarrow[.*]",
  "ignore:.*matrix subclass.*:PendingDeprecationWarning",
  "ignore:.*np.asscalar.*:DeprecationWarning",
  "ignore:.*deprecated create function*:DeprecationWarning",
  "ignore:.*importing the ABCs*:DeprecationWarning",
  "ignore:.*use_ratings option.*:UserWarning",
  "ignore:.*tensor support is in beta state.*:UserWarning",
]
log_cli_format = "[%(levelname)7s] %(asctime)s [%(processName)s] %(name)s %(message)s"
log_file_format = "[%(levelname)7s] %(asctime)s [%(processName)s] %(name)s %(message)s"
log_file_level = "DEBUG"
log_format = "[%(levelname)7s] [%(processName)s] %(name)s %(message)s"
log_level = "INFO"
markers = [
  "eval: mark the test as running the evaluator over custom data",
  "slow: mark the test as taking a larger-than-usual amount of time",
  "realdata: mark the test as using a real data set like ML-20M",
  "compat: mark the test as testing compatibility with old LensKit versions",
]
testpaths = "tests"
doctest_plus = true
doctest_subpackage_requires = ["src/lenskit/hpf.py = hpfrec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
extend-select = ["I", "W", "Q", "PLC2701"]
ignore = ["TRY201", "SIM118"]
unfixable = ["F401"]
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint.per-file-ignores]
# Importing PyTest fixtures triggers F811
"tests/*.py" = ["F811", "F401", "PLC2701", "RUF059"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["lenskit.training.TrainingOptions", "pyarrow.float32"]

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "testing",
  "first-party",
  "local-folder",
]
known-first-party = ["lenskit"]

[tool.ruff.lint.isort.sections]
testing = ["pytest", "hypothesis"]

# configure UV sources
[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-gpu", group = "gpu" },
]

# use the LensKit index to prefer CPU PyTorch
[[tool.uv.index]]
name = "lk-torch-cpu"
url = "https://pypi.lenskit.org/torch/cpu/"

[[tool.uv.index]]
name = "pytorch-gpu"
# url = "https://pypi.lenskit.org/torch/cu128"
url = "https://download.pytorch.org/whl/cu128/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
# url = "https://pypi.lenskit.org/torch/cpu"
url = "https://download.pytorch.org/whl/cpu/"
explicit = true
